# Build the production image on GitHub's runners and push it to GHCR.
#
# Why build here and not on the server: `bundle install` + `assets:precompile`
# want ~2GB RAM. The target server has well under that free, so building there
# would OOM (and on a shared box, take neighbours down with it). Runners are
# free for this and much faster.
#
# The server then only runs `docker compose pull && up -d` — see script/deploy.sh.
#
# Target platform is linux/amd64: the server is x86_64 (verified via `uname -m`).
# If you ever move to an ARM box (AWS Graviton), change `platforms` below.

name: Build & Publish Image

on:
  push:
    branches: [main]
    # Docs-only changes don't need a 10-minute image build.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**'
      - '!.github/workflows/deploy.yml'
  workflow_dispatch:      # lets you rebuild by hand from the Actions tab

concurrency:
  # A newer push makes an in-flight build pointless.
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Lowercased owner/repo — GHCR rejects uppercase in image names.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build linux/amd64 and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache across runs — Gemfile-only changes rebuild in ~2 min.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  /'
            echo '```'
            echo
            echo "Deploy on the server with:"
            echo '```bash'
            echo "  cd ~/spree && ./script/deploy.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
