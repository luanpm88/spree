# Build the customer storefront image (Next.js) and push it to GHCR.
#
# Separate from deploy.yml because this is a different app in a different
# language, with a different trigger path — a Rails-only change should not
# rebuild the storefront, and vice versa.
#
# IMPORTANT: the storefront prerenders pages against the Spree API at BUILD
# time (see storefront/Dockerfile), so SPREE_API_URL must be reachable from
# the GitHub runner and the backend must already be deployed and serving.
# Both values come from repo variables (Settings > Variables), not secrets —
# the publishable key is designed to be public, it ships in browser JS.

name: Build & Publish Storefront

on:
  push:
    branches: [main]
    paths:
      - 'storefront/**'
      - '.github/workflows/deploy-storefront.yml'
  workflow_dispatch:

concurrency:
  group: storefront-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-storefront

jobs:
  build:
    name: Build linux/amd64 and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the backend is reachable (build prerenders against it)
        run: |
          url="${{ vars.SPREE_API_URL_PROD }}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$url/up" || echo 000)
          echo "GET $url/up -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::Backend not healthy at $url/up (got $code). The storefront build prerenders pages against the Spree API and will fail or produce empty pages. Deploy/repair the backend first."
            exit 1
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: ./storefront
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SPREE_API_URL=${{ vars.SPREE_API_URL_PROD }}
            SPREE_PUBLISHABLE_KEY=${{ vars.SPREE_PUBLISHABLE_KEY_PROD }}
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront

      - name: Summary
        run: |
          {
            echo "### Storefront image published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  /'
            echo '```'
            echo "Built against: ${{ vars.SPREE_API_URL_PROD }}"
            echo
            echo "Deploy: \`ssh … 'cd ~/spree && ./script/deploy.sh'\`"
          } >> "$GITHUB_STEP_SUMMARY"
