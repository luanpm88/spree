# Recurring jobs — see https://github.com/rails/solid_queue#recurring-tasks
#
# Add your own like:
#   nightly_report:
#     class: MyReportJob
#     queue: spree_reports
#     schedule: at 5am every day
production:
  # Release checkout stock reservations whose hold expired, so inventory
  # returns to sellable stock promptly.
  expire_stock_reservations:
    class: Spree::StockReservations::ExpireJob
    schedule: every minute

  # Prune EU Omnibus price history past the retention period
  # (Spree::Config[:price_history_retention_days], default 30).
  prune_price_history:
    command: "Spree::PriceHistory.where('recorded_at < ?', (Spree::Config[:price_history_retention_days] || 30).days.ago).in_batches(of: 1000).delete_all"
    schedule: at 4am every day

  # Solid Queue / Solid Cable housekeeping.
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # `trimmable`, not `prunable` — solid_cable renamed the scope, and the name
  # inherited from the upstream starter raised NoMethodError every hour, so the
  # messages table was never trimmed and grew without bound. Both mean the same
  # thing: rows older than SolidCable's configured retention window.
  clear_solid_cable_messages:
    command: "SolidCable::Message.trimmable.in_batches(of: 1000).delete_all"
    schedule: every hour at minute 42
