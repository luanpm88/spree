# nginx vhost for shop.b-teka.com — the customer-facing storefront (Next.js).
#
# Install:
#   sudo cp deploy/nginx/shop.b-teka.com.conf /etc/nginx/sites-available/shop.b-teka.com
#   sudo ln -s /etc/nginx/sites-available/shop.b-teka.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d shop.b-teka.com
#
# Two hostnames, two apps, one server:
#   spree.b-teka.com -> Rails  (admin, API)      :3010
#   shop.b-teka.com  -> Next   (customer shop)   :3011
#
# Product images are NOT served from here — Spree returns Active Storage URLs on
# spree.b-teka.com, so the browser fetches them from the Rails vhost directly.

upstream spree_storefront {
    server 127.0.0.1:3011 fail_timeout=0;
    keepalive 16;
}

server {
    listen 80;
    server_name shop.b-teka.com;

    access_log /var/log/nginx/shop_b_teka_com.access.log;
    error_log  /var/log/nginx/shop_b_teka_com.error.log;

    client_max_body_size 16M;

    # Next.js build assets are content-hashed and safe to cache hard.
    location /_next/static/ {
        proxy_pass http://spree_storefront;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://spree_storefront;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Next dev/HMR and any streaming responses.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_upgrade;

        proxy_redirect off;
        # Off so React streaming (Suspense) flushes to the browser progressively
        # instead of nginx holding the whole document.
        proxy_buffering off;

        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    location ~ /\. {
        deny all;
    }
}
