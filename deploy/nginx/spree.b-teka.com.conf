# nginx vhost for spree.b-teka.com
#
# Install on the server:
#   sudo cp deploy/nginx/spree.b-teka.com.conf /etc/nginx/sites-available/spree.b-teka.com
#   sudo ln -s /etc/nginx/sites-available/spree.b-teka.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d spree.b-teka.com     # adds the TLS block below
#
# This box already serves ~28 other vhosts on 80/443 with certbot-managed TLS,
# so we follow the same convention: plain HTTP here, certbot rewrites this file
# to add `listen 443 ssl` plus the redirect. Do NOT hand-write the TLS block.
#
# Spree runs in Docker bound to 127.0.0.1:3010 (docker-compose.prod.yml) and is
# not reachable from the internet except through this proxy.

upstream spree_app {
    server 127.0.0.1:3010 fail_timeout=0;
    keepalive 8;
}

server {
    listen 80;
    server_name spree.b-teka.com;

    access_log /var/log/nginx/spree_b_teka_com.access.log;
    error_log  /var/log/nginx/spree_b_teka_com.error.log;

    # Product images and CSV imports go through here.
    client_max_body_size 64M;

    # Rails sets its own cache headers on digested assets; just pass through.
    location / {
        proxy_pass http://spree_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Required: the app runs with RAILS_ASSUME_SSL=true and reads this to
        # decide the scheme for generated URLs (image URLs, email links).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # ActionCable / Turbo Streams over websockets.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_upgrade;

        proxy_redirect off;
        proxy_buffering off;

        # Long enough for CSV imports and report generation.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Health endpoint — keep it out of the access log, uptime monitors are noisy.
    location = /up {
        proxy_pass http://spree_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }
}
