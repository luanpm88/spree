<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nothing client-specific is hardcoded here: this file is committed to a public
     repo, while docs/plan.json (which names the client and their shops) is not.
     Every label comes from the JSON at runtime. -->
<title>Project plan</title>
<script>
// Runs before first paint so the page never flashes the wrong theme. Explicit choice
// wins; otherwise follow the OS.
(function () {
  try {
    var saved = localStorage.getItem('plan-theme')
    document.documentElement.setAttribute('data-theme',
      saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'))
  } catch (e) { document.documentElement.setAttribute('data-theme', 'dark') }
})()
</script>
<style>
:root[data-theme="dark"]{
  --bg:#0d0f12; --bar:#13161b; --panel:#15181d; --panel2:#1b1f26; --hover:#1e222a;
  --line:#242932; --line2:#2e3540;
  --fg:#e7eaf0; --dim:#949cab; --faint:#616a79;
  --accent:#5eead4; --accent-fg:#0d0f12;
  --red:#f87171; --amber:#fbbf24; --green:#4ade80; --blue:#60a5fa; --violet:#a78bfa;
}
:root[data-theme="light"]{
  --bg:#f6f7f9; --bar:#fff; --panel:#fff; --panel2:#f2f4f7; --hover:#eef1f5;
  --line:#e3e6eb; --line2:#d3d8e0;
  --fg:#11141a; --dim:#525c6b; --faint:#7d8794;
  --accent:#0f766e; --accent-fg:#fff;
  --red:#dc2626; --amber:#b45309; --green:#15803d; --blue:#2563eb; --violet:#7c3aed;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
code,.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;font-size:.87em}
button{font:inherit;cursor:pointer}

/* ── top bar ───────────────────────────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:20;background:var(--bar);border-bottom:1px solid var(--line)}
.bar .in{max-width:1240px;margin:0 auto;padding:12px 20px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.title{font-size:15.5px;font-weight:650;letter-spacing:-.01em;margin:0}
.phase{font:600 10px/1 ui-monospace,monospace;letter-spacing:.11em;text-transform:uppercase;
  color:var(--accent-fg);background:var(--accent);padding:5px 9px;border-radius:4px}
.grow{flex:1}
.sub{font:11.5px ui-monospace,monospace;color:var(--faint)}
.live{display:inline-flex;align-items:center;gap:6px;font:11.5px ui-monospace,monospace;color:var(--faint)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.dot.stale{background:var(--amber)} .dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.dot.beat{animation:pulse 2s ease-in-out infinite}
.iconbtn{background:none;border:1px solid var(--line2);color:var(--dim);border-radius:6px;
  width:30px;height:30px;display:grid;place-items:center;padding:0}
.iconbtn:hover{color:var(--fg);border-color:var(--faint);background:var(--hover)}
.iconbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
:root[data-theme="dark"] .i-sun{display:block} :root[data-theme="dark"] .i-moon{display:none}
:root[data-theme="light"] .i-sun{display:none} :root[data-theme="light"] .i-moon{display:block}

/* ── tabs ──────────────────────────────────────────────────────────────── */
nav{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);
  padding:11px 13px;font-size:13.5px;font-weight:520;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .b{font:600 10.5px/1 ui-monospace,monospace;background:var(--panel2);color:var(--dim);
  border-radius:9px;padding:3px 6px;min-width:18px;text-align:center}
.tab[aria-selected="true"] .b{background:var(--accent);color:var(--accent-fg)}
.tab .b.alert{background:var(--red);color:#fff}

/* ── layout ────────────────────────────────────────────────────────────── */
main{max-width:1240px;margin:0 auto;padding:22px 20px 90px}
section[hidden]{display:none}
h2{font-size:12px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
h2:first-child{margin-top:0}

/* ── overview ──────────────────────────────────────────────────────────── */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:20px 22px;margin-bottom:12px}
.headline{font-size:19px;line-height:1.42;font-weight:520;letter-spacing:-.012em;margin:0 0 16px}
.next{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);
  border-left:3px solid var(--accent);border-radius:0 7px 7px 0;padding:13px 15px}
.next .l{font:600 10px/1.65 ui-monospace,monospace;letter-spacing:.1em;color:var(--accent);flex:0 0 auto}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin-bottom:12px}
.count{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;
  text-align:left;width:100%;display:block}
.count:hover{background:var(--hover);border-color:var(--line2)}
.count .n{font:650 24px/1.1 ui-monospace,monospace;letter-spacing:-.02em}
.count .l{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
.count.red .n{color:var(--red)} .count.amber .n{color:var(--amber)}
.count.green .n{color:var(--green)} .count.blue .n{color:var(--blue)}

/* ── toolbar ───────────────────────────────────────────────────────────── */
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:7px;
  padding:7px 11px;color:var(--fg);font-size:13.5px}
.search:focus{outline:none;border-color:var(--accent)}
.search::placeholder{color:var(--faint)}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:20px;
  padding:5px 12px;font-size:12.5px}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:560}

/* ── tables ────────────────────────────────────────────────────────────── */
.tw{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px}
th{text-align:left;font:600 10.5px/1 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--panel);position:sticky;top:0;user-select:none}
th.s{cursor:pointer} th.s:hover{color:var(--fg)}
th .a{opacity:.4;margin-left:3px}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--dim)}
tr.r{cursor:pointer} tr.r:hover td{background:var(--hover)}
tr:last-child td{border-bottom:none}
td.t{color:var(--fg);font-weight:530;max-width:520px}
td.n{white-space:nowrap;font-family:ui-monospace,monospace;font-size:12px}
.exp td{background:var(--panel2);padding:15px 18px 17px;color:var(--dim);font-size:13.5px}
.exp p{margin:0 0 9px} .exp p:last-child{margin-bottom:0}
.exp b{color:var(--fg);font-weight:600}
.exp ul{margin:8px 0 0;padding-left:18px} .exp li{margin-bottom:5px}
.caret{display:inline-block;width:9px;color:var(--faint);transition:transform .12s}
tr.open .caret{transform:rotate(90deg)}

/* pills */
.p{display:inline-block;font:600 10.5px/1 ui-monospace,monospace;letter-spacing:.03em;
  padding:4px 8px;border-radius:4px;text-transform:uppercase;white-space:nowrap}
.p.red{background:color-mix(in srgb,var(--red) 17%,transparent);color:var(--red)}
.p.amber{background:color-mix(in srgb,var(--amber) 17%,transparent);color:var(--amber)}
.p.green{background:color-mix(in srgb,var(--green) 17%,transparent);color:var(--green)}
.p.blue{background:color-mix(in srgb,var(--blue) 17%,transparent);color:var(--blue)}
.p.violet{background:color-mix(in srgb,var(--violet) 17%,transparent);color:var(--violet)}
.p.grey{background:var(--panel2);color:var(--faint)}
.tag{display:inline-block;font:11px ui-monospace,monospace;color:var(--faint);background:var(--panel2);
  border:1px solid var(--line);border-radius:4px;padding:2px 7px;margin:2px 4px 2px 0}
.tag.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 32%,transparent)}
.tag.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 32%,transparent)}

/* pagination — only rendered when a table exceeds PAGE_SIZE rows */
.pg{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 4px 0;
  font:11.5px ui-monospace,monospace;color:var(--faint)}
.pg button{background:var(--panel);border:1px solid var(--line);color:var(--dim);
  border-radius:6px;padding:4px 10px;font:11.5px ui-monospace,monospace}
.pg button:hover:not(:disabled){color:var(--fg);background:var(--hover)}
.pg button:disabled{opacity:.35;cursor:default}

/* Secondary prose under a row title. Deliberately NOT .sub — that is monospace,
   which is right for dates and counts and unreadable for a sentence. */
.note{color:var(--dim);font-size:12.8px;line-height:1.5;margin-top:4px;font-weight:400;max-width:96ch}
.copyable{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:2px 6px;display:inline-block;user-select:all}
.copyable:hover{border-color:var(--accent)}
.empty{color:var(--faint);padding:26px;text-align:center;font-size:13.5px}
.err{background:color-mix(in srgb,var(--red) 12%,var(--panel));border:1px solid var(--red);
  border-radius:10px;padding:16px 18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:9px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 17px}
.card h3{margin:0 0 6px;font-size:14px;font-weight:600}
.card p{margin:0 0 7px;color:var(--dim);font-size:13px} .card p:last-child{margin-bottom:0}
.card.warn{border-color:color-mix(in srgb,var(--amber) 40%,var(--line))}
.dim{color:var(--faint)}
.foot{color:var(--faint);font:11.5px ui-monospace,monospace;border-top:1px solid var(--line);
  padding-top:14px;margin-top:36px}
@media(max-width:640px){
  main{padding:16px 13px 70px} .bar .in{padding:10px 13px 0} nav{padding:0 13px}
  .headline{font-size:16.5px} .next{flex-direction:column;gap:5px}
}
</style>
</head>
<body>
<div class="bar">
  <div class="in">
    <h1 class="title" id="pname">Project plan</h1>
    <span class="phase" id="pphase"></span>
    <span class="grow"></span>
    <span class="live"><span class="dot beat" id="pulse"></span><span id="pulset">live</span></span>
    <span class="sub" id="pmeta"></span>
    <button class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>
  <nav id="tabs" role="tablist"></nav>
</div>
<main id="app"><p class="sub">loading…</p></main>

<script>
'use strict'
const PAGE_SIZE = 15
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const SEV = ['low','medium','high','critical']

let PLAN = null
let tab = (location.hash || '#overview').slice(1)
const ui = {}          // per-tab { q, sort, dir, page, open:Set }
const uiFor = (id) => (ui[id] ??= { q:'', sort:null, dir:1, page:0, open:new Set() })

/* ── data fetch ───────────────────────────────────────────────────────────
   The page polls plan.json rather than being rebuilt. Editing docs/plan.json is
   then the only step needed for this dashboard to be current. */
let lastRaw = null, failures = 0
async function tick() {
  const dot = document.getElementById('pulse'), lbl = document.getElementById('pulset')
  try {
    const res = await fetch('plan.json?t=' + Date.now(), { cache: 'no-store' })
    if (!res.ok) throw new Error('HTTP ' + res.status)
    const text = await res.text()
    let parsed
    try { parsed = JSON.parse(text) }
    catch (e) { throw new Error('plan.json is not valid JSON: ' + e.message) }
    failures = 0
    dot.className = 'dot beat'; lbl.textContent = 'live'
    dot.title = 'last checked ' + new Date().toLocaleTimeString()
    if (text !== lastRaw) { lastRaw = text; PLAN = parsed; render() }
  } catch (e) {
    failures++
    dot.className = 'dot ' + (failures > 3 ? 'err' : 'stale')
    lbl.textContent = failures > 3 ? 'offline' : 'retrying'
    dot.title = String(e.message || e)
    if (!PLAN) {
      document.getElementById('app').innerHTML =
        '<div class="err"><b>Cannot load plan.json</b><p style="margin:9px 0 0;color:var(--dim)">' +
        esc(e.message) + '</p><p style="margin:9px 0 0;color:var(--dim)">This page must be served over http. ' +
        'Opening the file directly gives it a null origin and the fetch is blocked. Try ' +
        '<code>http://admin.spree.local</code>.</p></div>'
    }
  }
}

/* ── tab definitions ────────────────────────────────────────────────────── */
const TABS = [
  { id:'overview',  label:'Overview',     count: () => null },
  { id:'waiting',   label:'Waiting',      count: (p) => open(p).length, alert: true },
  // Counts the ones waiting on US, not the total, and alerts on them. Same rule as
  // Work and Risks: the badge is a to-do count, not an inventory.
  { id:'their',     label:'Their tracker', alert: true,
    count: (p) => (p.client_tasks ?? []).filter(t => !t.completed && t.ball_in_court !== 'them').length },
  { id:'work',      label:'Work',         count: (p) => (p.tasks ?? []).filter(t => t.status !== 'done').length },
  { id:'risks',     label:'Risks',        count: (p) => (p.risks ?? []).filter(r => r.status !== 'mitigated').length },
  { id:'timeline',  label:'Conversation', count: (p) => (p.timeline ?? []).length },
  { id:'decisions', label:'Decisions',    count: (p) => (p.decisions ?? []).length },
  { id:'shipped',   label:'Shipped',      count: (p) => (p.done ?? []).length },
  { id:'estate',    label:'Estate',       alert: true, count: (p) => estateRows(p).length },
  // Alerts, because the only useful moment for this tab is the one where nobody
  // is thinking about backups.
  { id:'backups',   label:'Backups',      alert: true, count: (p) => backupRows(p).length },
  { id:'reference', label:'Reference',    count: () => null },
]
const open = (p) => (p.waiting_on_client ?? []).filter(w => w.status === 'open')

/* ── generic table ────────────────────────────────────────────────────────
   cols: [{key,label,w?,cell(row),sortVal(row)?,cls?}]  detail: (row) => html */
function table(tabId, rows, cols, detail, emptyMsg) {
  const s = uiFor(tabId)
  let data = rows.slice()

  if (s.q) {
    const q = s.q.toLowerCase()
    data = data.filter(r => JSON.stringify(r).toLowerCase().includes(q))
  }
  if (s.sort) {
    const col = cols.find(c => c.key === s.sort)
    if (col) data.sort((a, b) => {
      const va = col.sortVal ? col.sortVal(a) : String(col.cell(a)), vb = col.sortVal ? col.sortVal(b) : String(col.cell(b))
      return (va > vb ? 1 : va < vb ? -1 : 0) * s.dir
    })
  }

  const total = data.length
  const paged = total > PAGE_SIZE
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE))
  if (s.page >= pages) s.page = pages - 1
  const view = paged ? data.slice(s.page * PAGE_SIZE, (s.page + 1) * PAGE_SIZE) : data

  const H = []
  H.push(`<div class="tools">
    <input class="search" placeholder="Filter ${esc(tabId)}…" value="${esc(s.q)}" data-act="q" data-tab="${esc(tabId)}">
    <span class="sub">${total}${total !== rows.length ? ' of ' + rows.length : ''}</span>
  </div>`)

  if (!view.length) return H.join('') + `<div class="tw"><p class="empty">${esc(emptyMsg ?? 'Nothing here.')}</p></div>`

  H.push('<div class="tw"><table><thead><tr>')
  H.push('<th style="width:22px"></th>')
  for (const c of cols) {
    const active = s.sort === c.key
    H.push(`<th class="s" data-act="sort" data-tab="${esc(tabId)}" data-key="${esc(c.key)}"${c.w ? ` style="width:${c.w}"` : ''}>${esc(c.label)}<span class="a">${active ? (s.dir > 0 ? '↑' : '↓') : '↕'}</span></th>`)
  }
  H.push('</tr></thead><tbody>')
  for (const r of view) {
    const key = r.id ?? (r.date + r.summary)
    const isOpen = s.open.has(key)
    H.push(`<tr class="r${isOpen ? ' open' : ''}" data-act="row" data-tab="${esc(tabId)}" data-key="${esc(key)}">`)
    H.push(`<td><span class="caret">▸</span></td>`)
    for (const c of cols) H.push(`<td class="${c.cls ?? ''}">${c.cell(r)}</td>`)
    H.push('</tr>')
    if (isOpen) H.push(`<tr class="exp"><td colspan="${cols.length + 1}">${detail(r)}</td></tr>`)
  }
  H.push('</tbody></table></div>')

  if (paged) {
    H.push(`<div class="pg">
      <span>page ${s.page + 1} / ${pages}</span>
      <button data-act="pg" data-tab="${esc(tabId)}" data-to="0" ${s.page === 0 ? 'disabled' : ''}>«</button>
      <button data-act="pg" data-tab="${esc(tabId)}" data-to="${s.page - 1}" ${s.page === 0 ? 'disabled' : ''}>prev</button>
      <button data-act="pg" data-tab="${esc(tabId)}" data-to="${s.page + 1}" ${s.page >= pages - 1 ? 'disabled' : ''}>next</button>
      <button data-act="pg" data-tab="${esc(tabId)}" data-to="${pages - 1}" ${s.page >= pages - 1 ? 'disabled' : ''}>»</button>
    </div>`)
  }
  return H.join('')
}

const pill = (text, tone) => `<span class="p ${tone}">${esc(text)}</span>`
const TASK_TONE = { in_progress:'blue', todo:'grey', blocked:'red', parked:'violet', done:'green' }
const SEV_TONE  = { critical:'red', high:'red', medium:'amber', low:'grey' }

/* ── views ───────────────────────────────────────────────────────────────── */
/* Backups, surfaced where you already look rather than in a log file.
   Two separate failures, and the second is the one that bites: the backup can be
   broken, or the CHECK can have stopped running while the last verdict sits there
   saying everything is fine. A stale green is indistinguishable from a real green
   unless something watches the watcher, so this ages out its own result. */
const BACKUP_CHECK_STALE_HOURS = 48

function backupRows(p) {
  const b = p.health?.backups
  if (!b) return [{ k:'Backups', t:'No backup check has ever run', tone:'red',
    d:'Run `script/backups --deep --record`. Nothing on the client server is known to be recoverable.' }]

  const rows = []
  const checkedHrs = (Date.now() - new Date(b.checked_at).getTime()) / 3.6e6
  if (checkedHrs > BACKUP_CHECK_STALE_HOURS) {
    rows.push({ k:'Backups', t:`Backup check has not run for ${Math.round(checkedHrs / 24)} days`, tone:'red',
      d:`Last verdict was ${b.checked_at.slice(0, 16).replace('T', ' ')} and says "${b.ok ? 'ok' : 'failing'}", but it is too old to believe. The launchd job may have stopped.` })
  }
  if (!b.ok) {
    for (const problem of (b.problems ?? []).slice(0, 4))
      rows.push({ k:'Backups', t:problem, tone:'red', d:`Last backup ${b.last_backup_at ?? 'never'}. Fix with \`script/backups --run --deep\`.` })
  }
  return rows
}

function viewOverview(p) {
  const w = open(p), tasks = p.tasks ?? []
  const hiRisk = (p.risks ?? []).filter(r => r.severity === 'high' && r.status !== 'mitigated')
  const H = []
  H.push(`<div class="hero">
    <p class="headline">${esc(p.status.headline)}</p>
    <div class="next"><span class="l">NEXT</span><span>${esc(p.status.next_action)}</span></div>
  </div>`)
  H.push(`<div class="counts">
    ${cnt('waiting', w.length, 'waiting on client', w.length ? 'red' : 'green')}
    ${cnt('work', tasks.filter(t => t.status === 'in_progress').length, 'in progress', 'blue')}
    ${cnt('work', tasks.filter(t => t.status === 'todo').length, 'to do', '')}
    ${cnt('risks', hiRisk.length, 'high risk', hiRisk.length ? 'red' : 'green')}
    ${cnt('shipped', (p.done ?? []).length, 'shipped', 'green')}
  </div>`)

  const promises = tasks.filter(t => t.promised)
  if (promises.length) {
    H.push('<h2>Promised to the client</h2><div class="cards">')
    for (const t of promises) H.push(`<div class="card"><h3>${esc(t.title)}</h3><p>${esc(t.promised)}</p></div>`)
    H.push('</div>')
  }

  H.push('<h2>Needs attention</h2>')
  const rows = [
    ...w.filter(x => x.severity === 'high').map(x => ({ k:'Waiting', t:x.question, d:x.why_it_matters, tone:'red' })),
    ...hiRisk.map(x => ({ k:'Risk', t:x.title, d:x.detail, tone:'red' })),
    ...tasks.filter(t => t.status === 'blocked').map(x => ({ k:'Blocked', t:x.title, d:x.detail, tone:'amber' })),
    ...backupRows(p),
    ...estateRows(p),
  ]
  if (!rows.length) H.push('<div class="tw"><p class="empty">Nothing urgent.</p></div>')
  else {
    H.push('<div class="tw"><table><thead><tr><th style="width:110px">Kind</th><th>What</th></tr></thead><tbody>')
    for (const r of rows) H.push(`<tr><td>${pill(r.k, r.tone)}</td><td class="t">${esc(r.t)}<div class="note">${esc(r.d)}</div></td></tr>`)
    H.push('</tbody></table></div>')
  }

  const last = [...(p.timeline ?? [])].sort((a, b) => a.date.localeCompare(b.date)).pop()
  if (last) {
    H.push('<h2>Last contact</h2>')
    H.push(`<div class="card"><h3>${esc(last.date)} ${last.direction === 'in' ? '←' : '→'} ${esc(last.summary)}</h3><p>${esc(last.detail ?? '')}</p></div>`)
  }
  return H.join('')
}
const cnt = (to, n, l, c) => `<button class="count ${c}" data-act="go" data-to="${to}"><div class="n">${n}</div><div class="l">${esc(l)}</div></button>`

// Tables render in the order they are handed, and plan.json appends. Past PAGE_SIZE
// rows that means the NEWEST item, which is usually the one that just started blocking
// something, falls onto page two and reads as absent. Pre-sorting by urgency puts what
// matters on page one; the column headers still re-sort on click.
const rank = (list, v) => { const i = list.indexOf(v); return i === -1 ? list.length : i }
const byUrgency = (rows, statusOrder, statusOf, sevOf) =>
  [...rows].sort((a, b) =>
    rank(statusOrder, statusOf(a)) - rank(statusOrder, statusOf(b)) ||
    rank(SEV_DESC, sevOf?.(a)) - rank(SEV_DESC, sevOf?.(b)))
const SEV_DESC = ['high', 'medium', 'low']

function viewWaiting(p) {
  const rows = byUrgency(p.waiting_on_client ?? [], ['open', 'dropped', 'answered'],
    (r) => r.status, (r) => r.severity)
  return table('waiting', rows, [
    { key:'status', label:'Status', w:'96px', cell:r => pill(r.status, r.status === 'open' ? (r.severity === 'high' ? 'red' : 'amber') : 'green'), sortVal:r => r.status },
    { key:'question', label:'Question', cls:'t', cell:r => esc(r.question), sortVal:r => r.question },
    { key:'asked_on', label:'Asked', w:'104px', cls:'n', cell:r => esc(r.asked_on ?? '—'), sortVal:r => r.asked_on ?? '' },
    { key:'severity', label:'Sev', w:'80px', cell:r => pill(r.severity ?? 'low', SEV_TONE[r.severity] ?? 'grey'), sortVal:r => SEV.indexOf(r.severity) },
  ], r => {
    const H = [`<p><b>Why it matters.</b> ${esc(r.why_it_matters ?? '—')}</p>`]
    if (r.answer) H.push(`<p><b>Answer.</b> ${esc(r.answer)}</p>`)
    if (r.follow_up) H.push(`<p><b>Still open.</b> ${esc(r.follow_up)}</p>`)
    if ((r.blocks ?? []).length) H.push(`<p>${r.blocks.map(b => `<span class="tag warn">blocks ${esc(taskName(b))}</span>`).join('')}</p>`)
    return H.join('')
  }, 'Nothing outstanding with the client.')
}
const taskName = (id) => ((PLAN?.tasks ?? []).find(t => t.id === id)?.title) ?? id

// The client's own tracker. Separate from Work on purpose: those tasks are ours and we
// set their state, these are his and all we control is whether we have answered.
function viewTheir(p) {
  const c = p.collaboration
  const head = c
    ? `<div class="card" style="margin-bottom:10px"><h3>${esc(c.system)} · ${esc(c.project)}</h3>
         ${c.project_url ? `<p><a href="${esc(c.project_url)}" rel="noreferrer">${esc(c.project_url)}</a></p>` : ''}
         ${(c.members ?? []).length ? `<p>${c.members.map((m) => `<span class="tag">${esc(m)}</span>`).join('')}</p>` : ''}
         ${c.note ? `<p><b>Note.</b> ${esc(c.note)}</p>` : ''}</div>`
    : ''
  return head + syncBanner(p) + table('their', p.client_tasks ?? [], [
    // ball_in_court, not status. It is recomputed from the real comment thread on every
    // sync, so it cannot drift; status is prose someone typed and may be a week old.
    { key:'ball', label:'Waiting on', w:'116px',
      cell:r => r.completed ? pill('closed','grey')
        : r.ball_in_court === 'us' ? pill('us','red')
        : r.ball_in_court === 'them' ? pill('them','amber')
        : pill(r.status ?? '—','grey'),
      sortVal:r => r.completed ? 'z' : r.ball_in_court ?? '' },
    { key:'number', label:'Task', w:'130px', cls:'n', cell:r => esc(r.number), sortVal:r => r.number },
    { key:'title', label:'Title', cls:'t', cell:r => esc(r.title), sortVal:r => r.title },
    { key:'last', label:'Last word', w:'150px', cls:'n',
      cell:r => r.last_comment_by ? `${esc(r.last_comment_by.split(' ')[0])} <span class="dim">${esc(r.last_comment_on ?? '')}</span>` : '<span class="dim">no replies</span>',
      sortVal:r => r.last_comment_on ?? '' },
    { key:'created', label:'Created', w:'104px', cls:'n', cell:r => esc(r.created ?? '—'), sortVal:r => r.created ?? '' },
  ], r => {
    const H = []
    if (r.status) H.push(`<p><b>Where it stands.</b> ${esc(r.status)}</p>`)
    if (r.asks) H.push(`<p><b>They asked.</b> ${esc(r.asks)}</p>`)
    if (r.our_reply) H.push(`<p><b>We answered.</b> ${esc(r.our_reply)}</p>`)
    if (r.waiting_for) H.push(`<p><b>Waiting on.</b> ${esc(r.waiting_for)}</p>`)
    const tags = []
    if (r.task_list) tags.push(`<span class="tag">${esc(r.task_list)}</span>`)
    if (r.assignee) tags.push(`<span class="tag">${esc(r.assignee)}</span>`)
    if (typeof r.comments_count === 'number') tags.push(`<span class="tag">${r.comments_count} comment${r.comments_count === 1 ? '' : 's'}</span>`)
    if (r.artifact) tags.push(`<span class="tag">${esc(r.artifact)}</span>`)
    if (tags.length) H.push(`<p>${tags.join('')}</p>`)
    if (r.url) H.push(`<p><a href="${esc(r.url)}" rel="noreferrer">open in ${esc(c?.system ?? 'tracker')}</a></p>`)
    // The hint stays generic. This repo is public, and the scratch directory the
    // replies actually live in is named after the client.
    if (r.ac_id) H.push(`<p class="dim">reply from here: <code>script/ac_comment ${esc(String(r.number ?? '').replace(/\D+/g,'').slice(0,2))} &lt;your-reply&gt;.md</code></p>`)
    return H.join('')
  }, 'No tasks on their side yet.')
}

// Whether the tracker data on this screen is live or a corpse. Without this the page
// looks identical whether script/ac_sync --watch is running or died an hour ago, and
// a stale "waiting on them" is worse than no answer at all.
function syncBanner(p) {
  const at = p.meta?.ac_synced_at
  if (!at) {
    return `<div class="card warn" style="margin-bottom:10px"><p><b>Not syncing.</b>
      These rows were typed by hand. Start the live feed with <code>script/ac_sync --watch</code>.</p></div>`
  }
  const age = Math.max(0, Math.round((Date.now() - Date.parse(at)) / 1000))
  const ago = age < 90 ? `${age}s ago` : age < 5400 ? `${Math.round(age / 60)}m ago` : `${Math.round(age / 3600)}h ago`
  // The watcher ticks every 120s, so anything past ~5 min means it is not running.
  const dead = age > 300
  return `<div class="card${dead ? ' warn' : ''}" style="margin-bottom:10px"><p>
    <span class="tag ${dead ? 'warn' : 'ok'}">${dead ? 'stale' : 'live'}</span>
    synced from ActiveCollab <b>${ago}</b>
    ${dead ? '— the watcher is not running. <code>script/ac_sync --watch</code>' : ''}</p></div>`
}

function viewWork(p) {
  const rows = byUrgency(p.tasks ?? [], ['in_progress', 'blocked', 'todo', 'parked', 'done'], (r) => r.status)
  return table('work', rows, [
    { key:'status', label:'Status', w:'110px', cell:r => pill(r.status.replace('_',' '), TASK_TONE[r.status] ?? 'grey'), sortVal:r => ['in_progress','blocked','todo','parked','done'].indexOf(r.status) },
    { key:'title', label:'Task', cls:'t', cell:r => esc(r.title), sortVal:r => r.title },
    { key:'phase', label:'Phase', w:'110px', cell:r => `<span class="tag">${esc(r.phase ?? '—')}</span>`, sortVal:r => r.phase ?? '' },
    { key:'blocked', label:'Blocked by', w:'170px', cell:r => (r.blocked_by ?? []).length
        ? (r.blocked_by ?? []).map(b => {
            const w = (PLAN?.waiting_on_client ?? []).find(x => x.id === b)
            const done = w && w.status === 'answered'
            return `<span class="tag ${done ? 'ok' : 'warn'}">${done ? '✓' : '⛔'}</span>`
          }).join('')
        : '<span class="sub">—</span>',
      sortVal:r => (r.blocked_by ?? []).length },
  ], r => {
    const H = [`<p>${esc(r.detail)}</p>`]
    if (r.why) H.push(`<p><b>Why.</b> ${esc(r.why)}</p>`)
    if (r.promised) H.push(`<p><b>Promised.</b> ${esc(r.promised)}</p>`)
    if (r.parked_reason) H.push(`<p><b>Parked because.</b> ${esc(r.parked_reason)}</p>`)
    if (r.value) H.push(`<p><b>Value.</b> ${esc(r.value)}</p>`)
    if (r.impact) H.push(`<p><b>Impact.</b> ${esc(r.impact)}</p>`)
    if (r.unknown) H.push(`<p><b>Unknown.</b> ${esc(r.unknown)}</p>`)
    if (r.blocked_note) H.push(`<p>${esc(r.blocked_note)}</p>`)
    if ((r.findings ?? []).length) H.push(`<ul>${r.findings.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`)
    if ((r.options ?? []).length) H.push(`<p><b>Options.</b></p><ul>${r.options.map(o => `<li>${esc(o)}</li>`).join('')}</ul>`)
    if ((r.blocked_by ?? []).length) {
      H.push('<p>' + r.blocked_by.map(b => {
        const w = (PLAN?.waiting_on_client ?? []).find(x => x.id === b)
        return `<span class="tag ${w && w.status === 'answered' ? 'ok' : 'warn'}">${esc(w ? w.question : b)}</span>`
      }).join('') + '</p>')
    }
    return H.join('')
  }, 'No tasks.')
}

function viewRisks(p) {
  return table('risks', p.risks ?? [], [
    { key:'severity', label:'Sev', w:'86px', cell:r => pill(r.severity, SEV_TONE[r.severity] ?? 'grey'), sortVal:r => SEV.indexOf(r.severity) },
    { key:'title', label:'Risk', cls:'t', cell:r => esc(r.title), sortVal:r => r.title },
    { key:'status', label:'Status', w:'130px', cell:r => pill(r.status, r.status === 'mitigated' ? 'green' : r.status === 'communicated' ? 'blue' : 'amber'), sortVal:r => r.status },
  ], r => `<p>${esc(r.detail)}</p>${r.mitigation ? `<p><b>Mitigation.</b> ${esc(r.mitigation)}</p>` : ''}`,
  'No risks recorded.')
}

function viewTimeline(p) {

function viewDecisions(p) {

    { key:'decision', label:'Decision', cls:'t', cell:r => esc(r.decision), sortVal:r => r.decision },

/* ── estate ───────────────────────────────────────────────────────────────
   One row per shop, answering "what is the architecture of that box" without
   ssh-ing in. Every field is collected by `script/estate` on each run rather
   than written into plan.json by hand: a hand-kept inventory goes stale in the
   direction that matters, saying a thing is up after it stopped.

   Anything wrong with a shop is a row in Needs attention on the overview, so
   this tab is where you go to understand the estate, not where you go to find
   out something broke. */
const ESTATE_STALE_HOURS = 48

function estateRows(p) {
  const e = p.health?.estate
  if (!e) return [{ k:'Estate', t:'The server has never been surveyed', tone:'amber',
    d:'Run `script/estate --record`. Nothing here knows what is deployed.' }]
  const rows = []
  const age = (Date.now() - new Date(e.collected_at).getTime()) / 3.6e6
  if (age > ESTATE_STALE_HOURS) {
    rows.push({ k:'Estate', t:`Server survey is ${Math.round(age / 24)} days old`, tone:'amber',
      d:'Everything on the Estate tab describes how the box looked then, not now. Run `script/estate --record`.' })
  }
  for (const s of e.shops ?? []) {
    const down = (s.containers ?? []).filter(c => c.state !== 'running')
    if (down.length) rows.push({ k:'Estate', t:`${s.shop}: ${down.map(c => c.service).join(', ')} not running`, tone:'red',
      d:`On ${e.host?.hostname ?? 'the server'}. The shop is degraded or offline.` })
    const unhealthy = (s.containers ?? []).filter(c => c.health === 'unhealthy')
    if (unhealthy.length) rows.push({ k:'Estate', t:`${s.shop}: ${unhealthy.map(c => c.service).join(', ')} unhealthy`, tone:'red',
      d:'Running but failing its own health check.' })
    // Silent by design in Spree, which is exactly why it is loud here: with no
    // SMTP_HOST the app logs mail and returns success, and the customer gets
    // nothing. No exception, no bounce, no clue.
    if (s.mail !== 'configured') rows.push({ k:'Estate', t:`${s.shop} cannot send email`, tone:'amber',
      d:'No SMTP host configured, so order confirmations are written to the log and silently dropped.' })
  }
  return rows
}

function viewEstate(p) {
  const e = p.health?.estate
  const H = []
  if (!e) {
    H.push(`<div class="err"><b>The server has never been surveyed</b>
      <p style="margin:9px 0 0;color:var(--dim)">Run <code>script/estate --record</code>.</p></div>`)
    return H.join('')
  }

  const h = e.host ?? {}
  const shops = e.shops ?? []
  const age = (Date.now() - new Date(e.collected_at).getTime()) / 3.6e6
  const allUp = shops.every(s => (s.containers ?? []).every(c => c.state === 'running'))

  H.push(`<div class="hero">
    <p class="headline">${shops.length} shop${shops.length === 1 ? '' : 's'} on ${esc(h.hostname ?? '?')}, ${allUp ? 'all containers running' : 'something is not running'}.</p>
    <div class="next"><span class="l">SURVEYED</span><span>${esc(e.collected_at.slice(0, 16).replace('T', ' '))} UTC${age > ESTATE_STALE_HOURS ? ' — stale, re-run script/estate' : ''}</span></div>
  </div>`)

  H.push(`<div class="counts">
    ${cnt('estate', shops.length, 'shops', '')}
    ${cnt('estate', shops.reduce((n, s) => n + (s.containers ?? []).filter(c => c.state === 'running').length, 0), 'containers up', allUp ? 'green' : 'red')}
    ${cnt('estate', h.cores ?? '?', 'cores', '')}
    ${cnt('estate', h.ram_mb ? `${Math.round(h.ram_mb / 1024)}G` : '?', 'memory', '')}
    ${cnt('estate', (e.disks ?? [])[0]?.free ?? '?', 'disk free', '')}
  </div>`)

  H.push(`<h2>The box</h2><div class="card">
    <h3>${esc(h.hostname ?? '?')}</h3>
    <p>${esc(h.os ?? '')} · kernel ${esc(h.kernel ?? '')} · ${esc(h.docker ?? '')} · ${esc(h.uptime ?? '')}</p>
    <p>${(e.disks ?? []).map(d => `${esc(d.mount)} ${esc(d.size)}, ${esc(d.free)} free (${esc(d.used)} used)`).join(' · ')}</p>
  </div>`)

  // The wide one. Scrolls inside its own container rather than pushing the page.
  // Ports live under the address they serve rather than in a column of their own.
  // Two numbers with no context needed a column; next to the hostname they need a
  // line, and that buys back the width for Mail, which is a warning rather than a
  // detail and was being pushed off the visible edge of the table.
  H.push('<h2>Shops</h2><div class="tw"><table><thead><tr>' +
    '<th>Shop</th><th style="width:160px">Admin</th><th style="width:160px">Storefront</th>' +
    '<th style="width:120px">Containers</th><th style="width:92px">Deployed</th>' +
    '<th style="width:110px">Data</th>' +
    '<th style="width:92px">Size</th><th style="width:96px">Backup</th><th style="width:74px">Mail</th>' +
    '</tr></thead><tbody>')
  for (const s of shops) {
    const cs = s.containers ?? []
    const up = cs.filter(c => c.state === 'running').length
    const cTone = up === cs.length && cs.length ? '' : 'red'
    const b = s.backup
    const bCell = b && b.age_hours !== null
      ? (b.age_hours <= 26 ? `${b.age_hours}h ago` : pill(`${b.age_hours}h old`, 'red'))
      : pill('none', 'red')
    H.push(`<tr>
      <td class="t">${esc(s.shop)}<div class="note">${esc(s.name ?? '')}</div></td>
      <td class="n">${s.admin_host ? `<a href="https://${esc(s.admin_host)}/admin" target="_blank" rel="noopener">${esc(s.admin_host)}</a>` : '<span class="note">none</span>'}<div class="note">:${s.backend_port ?? '-'}</div></td>
      <td class="n">${s.storefront_url ? `<a href="${esc(s.storefront_url)}" target="_blank" rel="noopener">${esc(String(s.storefront_url).replace(/^https?:\/\//, ''))}</a>` : '<span class="note">not deployed</span>'}<div class="note">:${s.storefront_port ?? '-'}</div></td>
      <td>${cTone ? pill(`${up}/${cs.length} up`, 'red') : `${up}/${cs.length} up`}
        <div class="note">${cs.map(c => esc(`${c.service}:${c.health || c.state}`)).join('<br>')}</div></td>
      <td class="n">${esc(s.revision ?? '?')}<div class="note">${esc(s.deployed_at ?? '')}</div></td>
      <td class="n">${s.data ? `${s.data.products} prod<div class="note">${s.data.orders} orders · ${s.data.customers} cust</div>` : '<span class="note">?</span>'}</td>
      <td class="n">${s.sizes ? `${bytes(s.sizes.db)}<div class="note">up ${bytes(s.sizes.storage)}</div>` : '<span class="note">?</span>'}</td>
      <td class="n">${bCell}${b ? `<div class="note">${bytes(b.bytes)} · ${b.generations} kept</div>` : ''}</td>
      <td>${s.mail === 'configured' ? 'ok' : pill('silent', 'amber')}</td>
    </tr>`)
  }
  H.push('</tbody></table></div>')

  if ((e.nginx ?? []).length) {
    H.push('<h2>What nginx answers on</h2><div class="tw"><table><thead><tr>' +
      '<th>Site</th><th>Server name</th><th style="width:100px">Proxies to</th><th style="width:70px">TLS</th></tr></thead><tbody>')
    for (const n of e.nginx) {
      // A vhost with no server_name is nginx's stock catch-all. It serves nothing
      // and wants no certificate, so flagging it red for missing TLS is noise, and
      // noise here costs the real red flags their meaning.
      const isCatchAll = !n.server_name || n.server_name === '_'
      H.push(`<tr><td class="t">${esc(n.file)}</td>` +
        `<td class="n">${isCatchAll ? '<span class="note">catch-all, serves nothing</span>' : esc(n.server_name)}</td>` +
        `<td class="n">${n.proxy_port ? `127.0.0.1:${n.proxy_port}` : '<span class="note">-</span>'}</td>` +
        `<td>${n.tls ? 'yes' : isCatchAll ? '<span class="note">n/a</span>' : pill('no', 'red')}</td></tr>`)
    }
    H.push('</tbody></table></div>')
  }

  H.push(`<h2>How a shop is put together</h2><div class="card">
    <p>One directory per shop under <code>/srv</code>, one compose stack inside it, nothing shared
    between shops except nginx and the kernel. <code>/srv/&lt;shop&gt;/app</code> is the code,
    <code>docker-compose.yml</code> the stack, <code>.env</code> that shop's secrets.</p>
    <p>Three containers: <b>postgres</b> holds the data, <b>web</b> is Rails and serves
    <code>/admin</code> and the API, <b>storefront</b> is the Next.js shop customers see.
    Spree 5.5 dropped the Rails storefront and 5.6 ships no replacement, which is why the
    front end is a separate image at all.</p>
    <p>Every port binds to <code>127.0.0.1</code> only. nginx on the host terminates TLS and
    proxies in, so nothing here is reachable from the internet except through it. Binding
    <code>0.0.0.0</code> would publish the app directly, because Docker writes its NAT rules
    ahead of the firewall.</p>
    <p><code>SPREE_API_URL</code> and the publishable key are <em>build</em> arguments for the
    storefront, not runtime ones, so pointing a shop at a different backend means rebuilding
    that image rather than editing an env var.</p>
  </div>`)

  return H.join('')
}

/* ── backups ──────────────────────────────────────────────────────────────
   Written after a postgres volume was recreated on the client's live server to
   change a password, taking a morning of his admin settings with it. Nothing
   existed to restore from and nothing anywhere said so.

   The tab answers three questions in the order you actually ask them at the
   moment you need it: is there a backup, is it recent enough to be worth
   anything, and what exactly do I type to get the data back. The restore recipe
   is spelled out rather than linked, because the day you want it is not the day
   to go looking for it. */
const bytes = (n) => {
  if (!n) return '0'
  const u = ['b', 'K', 'M', 'G']
  let i = 0, v = n
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++ }
  return `${v < 10 && i > 0 ? v.toFixed(1) : Math.round(v)}${u[i]}`
}

function viewBackups(p) {
  const b = p.health?.backups
  const H = []

  if (!b) {
    H.push(`<div class="err"><b>No backup check has ever run</b>
      <p style="margin:9px 0 0;color:var(--dim)">Nothing on the client server is known to be recoverable.
      Run <code>script/backups --run --deep --record</code>.</p></div>`)
    return H.join('')
  }

  const checkedHrs = (Date.now() - new Date(b.checked_at).getTime()) / 3.6e6
  const stale = checkedHrs > BACKUP_CHECK_STALE_HOURS
  const shops = b.shops ?? []
  const oldest = shops.length ? Math.max(...shops.map(s => s.age_hours ?? 9e9)) : null
  const totalKept = shops.reduce((n, s) => n + (s.generations ?? 0), 0)

  H.push(`<div class="hero">
    <p class="headline">${b.ok && !stale ? 'Every shop has a verified backup from the last day.' : 'Backups need attention.'}</p>
    <div class="next"><span class="l">CHECKED</span><span>${esc(b.checked_at.slice(0, 16).replace('T', ' '))} UTC${stale ? ' — too old to believe' : ''}</span></div>
  </div>`)

  H.push(`<div class="counts">
    ${cnt('backups', oldest === null ? '—' : `${oldest}h`, 'oldest backup', oldest !== null && oldest <= 26 ? 'green' : 'red')}
    ${cnt('backups', shops.length, 'shops covered', shops.length ? 'green' : 'red')}
    ${cnt('backups', totalKept, 'copies kept', '')}
    ${cnt('backups', b.cron === 'installed' ? 'on' : 'OFF', 'nightly cron', b.cron === 'installed' ? 'green' : 'red')}
    ${cnt('backups', b.disk_used ?? '?', 'disk used', parseInt(b.disk_used) > 85 ? 'red' : 'green')}
  </div>`)

  if ((b.problems ?? []).length) {
    H.push('<h2>Problems</h2><div class="tw"><table><tbody>')
    for (const pr of b.problems) H.push(`<tr><td style="width:90px">${pill('Backup', 'red')}</td><td class="t">${esc(pr)}</td></tr>`)
    H.push('</tbody></table></div>')
  }

  H.push('<h2>What is stored</h2><div class="tw"><table><thead><tr>' +
    '<th>Shop</th><th style="width:74px">Age</th><th style="width:80px">Database</th>' +
    '<th style="width:74px">Uploads</th><th style="width:74px">App</th>' +
    '<th style="width:70px">Copies</th><th style="width:96px">Verified</th></tr></thead><tbody>')
  for (const s of shops) {
    const fresh = s.age_hours !== null && s.age_hours <= 26
    // "Verified" means a dump that was read back, not one that merely exists.
    const verified = s.complete === undefined ? '<span class="note">size only</span>'
      : s.complete ? `${s.tables} tables` : pill('TRUNCATED', 'red')
    H.push(`<tr><td class="t">${esc(s.shop)}</td>` +
      `<td class="${fresh ? '' : 'n'}">${s.age_hours === null ? pill('none', 'red') : `${s.age_hours}h`}</td>` +
      `<td class="n">${bytes(s.db)}</td><td class="n">${bytes(s.storage)}</td><td class="n">${bytes(s.app)}</td>` +
      `<td class="n">${s.generations}</td><td>${verified}</td></tr>`)
  }
  H.push('</tbody></table></div>')

  H.push(`<h2>Getting it back</h2><div class="card">
    <h3>Restore the database onto a running shop</h3>
    <p>The dump carries <code>--clean --if-exists</code>, so it replays over a live database
    without dropping it first. That is deliberate: the mistake this whole tab exists
    because of was reaching for a delete when a replay would have done.</p>
    <p><code>zcat /var/backups/spree/&lt;shop&gt;/&lt;stamp&gt;/db.sql.gz | docker compose exec -T postgres psql -U postgres spree_production</code></p>
    <h3>Restore uploaded images</h3>
    <p><code>docker run --rm -i -v &lt;shop&gt;_storage_data:/v alpine tar -xzf - -C /v &lt; storage.tar.gz</code></p>
    <h3>Restore the client's own files</h3>
    <p>Mail templates, the shipping calculator and the postcode list are gitignored,
    so <code>app.tar.gz</code> is the only copy that exists anywhere.
    <code>tar -xzf app.tar.gz -C /srv</code></p>
    <h3>Before touching anything</h3>
    <p><code>ssh &lt;server&gt; /usr/local/bin/spree-backup &lt;shop&gt;</code> — takes about five seconds and is the rule now, not a suggestion.</p>
  </div>`)

  H.push(`<h2>How this is checked</h2><div class="card">
    <p>The nightly job runs on the server at 02:15 UTC and keeps 14 days.
    <code>script/backups --deep --record</code> runs from a laptop, not from the server, for the
    same reason <code>script/uptime</code> does: a checker living on the box it watches has nothing
    to say on the day that box is the problem.</p>
    <p>It reads each dump back rather than trusting an exit code, because
    <code>pg_dump</code> returns success on a file truncated by a full disk. This page also ages out
    its own verdict after ${BACKUP_CHECK_STALE_HOURS} hours, so a check that quietly stopped
    running shows up as red rather than as a stale green.</p>
  </div>`)

  return H.join('')
}

function viewReference(p) {
  const H = []
  if (p.client) {
    H.push('<h2>Client</h2><div class="card">')
    H.push(`<h3>${esc(p.client.name)} — ${esc(p.client.company)}</h3>`)
    for (const k of ['business','channel','technical_level','style_note','timezone_note'])
      if (p.client[k]) H.push(`<p>${esc(p.client[k])}</p>`)
    H.push('</div>')
  }
  if ((p.shops ?? []).length) {
    H.push('<h2>Their shops</h2><div class="tw"><table><thead><tr><th>Shop</th><th style="width:150px">Status</th><th style="width:130px">Spree</th><th style="width:80px">Docker</th><th>Notes</th></tr></thead><tbody>')
    for (const s of p.shops) H.push(`<tr><td class="t">${esc(s.name)}</td><td>${esc(s.status)}</td><td class="n">${esc(s.spree_version)}</td><td>${s.docker ? 'yes' : 'no'}</td><td>${esc(s.notes)}</td></tr>`)
    H.push('</tbody></table></div>')
  }
  if ((p.servers ?? []).length) {
    // The connect line is rendered as code and shown in full rather than summarised.
    // The point of this row is that nobody has to go and find it again.
    H.push('<h2>Servers</h2><div class="tw"><table><thead><tr><th>Server</th><th style="width:88px">Owner</th><th style="width:150px">Status</th><th>How to get in</th></tr></thead><tbody>')
    for (const s of p.servers) {
      const access = []
      if (s.connect) access.push(`<div><code class="copyable" title="click to copy">${esc(s.connect)}</code></div>`)
      if (s.host) access.push(`<div class="note">host ${esc(s.host)}${s.ssh_port ? ` · port ${esc(String(s.ssh_port))}` : ''}${s.ssh_key ? ` · key ${esc(s.ssh_key)}` : ''}</div>`)
      if (!s.connect && s.access) access.push(`<div>${esc(s.access)}</div>`)
      if (s.spec) access.push(`<div class="note">${esc(s.spec)}</div>`)
      if (s.paths) access.push(`<div class="note">${esc(s.paths)}</div>`)
      H.push(`<tr><td class="t">${esc(s.name)}${s.notes ? `<div class="note">${esc(s.notes)}</div>` : ''}</td>` +
             `<td>${esc(s.owner)}</td><td>${esc(s.status)}</td><td>${access.join('') || '—'}</td></tr>`)
    }
    H.push('</tbody></table></div>')
  }
  if ((p.open_questions_for_us ?? []).length) {
    H.push('<h2>Open on our side</h2><div class="cards">')
    for (const q of p.open_questions_for_us) H.push(`<div class="card"><h3>${esc(q.question)}</h3><p>${esc(q.why)}</p><p><span class="tag warn">${esc(q.status)}</span></p></div>`)
    H.push('</div>')
  }
  if ((p.learnings ?? []).length) {
    H.push('<h2>Learned</h2><div class="cards">')
    for (const l of p.learnings) H.push(`<div class="card"><h3>${esc(l.title)}</h3><p>${esc(l.detail)}</p></div>`)
    H.push('</div>')
  }
  if (p.environments) {
    H.push('<h2>Environments</h2><div class="cards">')
    for (const [n, env] of Object.entries(p.environments)) {
      H.push(`<div class="card"><h3>${esc(n)}</h3>`)
      for (const [k, v] of Object.entries(env))
        H.push(`<p><span class="mono" style="color:var(--faint)">${esc(k)}</span> ${/^https?:\/\//.test(String(v)) ? `<a href="${esc(v)}" rel="noreferrer">${esc(v)}</a>` : esc(v)}</p>`)
      H.push('</div>')
    }
    H.push('</div>')
  }
  if (p.stack) {
    H.push('<h2>Stack</h2><div class="tw"><table><thead><tr><th style="width:190px">Component</th><th>Version</th></tr></thead><tbody>')
    for (const [k, v] of Object.entries(p.stack)) H.push(`<tr><td class="t">${esc(k)}</td><td>${esc(v)}</td></tr>`)
    H.push('</tbody></table></div>')
  }
  if ((p.docs_index ?? []).length) {
    H.push('<h2>Documents</h2><div class="tw"><table><thead><tr><th style="width:210px">File</th><th>Purpose</th></tr></thead><tbody>')
    for (const d of p.docs_index) H.push(`<tr><td class="t mono">${esc(d.file)}</td><td>${esc(d.purpose)}</td></tr>`)
    H.push('</tbody></table></div>')
  }
  return H.join('')
}

const VIEWS = { overview:viewOverview, waiting:viewWaiting, their:viewTheir, work:viewWork, risks:viewRisks,
                timeline:viewTimeline, decisions:viewDecisions, shipped:viewShipped,
                estate:viewEstate, backups:viewBackups, reference:viewReference }

/* ── render ───────────────────────────────────────────────────────────────── */
function render() {
  const p = PLAN
  if (!p) return
  document.title = p.meta.project + ' — plan'
  document.getElementById('pname').textContent = p.meta.project
  document.getElementById('pphase').textContent = p.status.phase
  document.getElementById('pmeta').textContent = 'rev ' + p.meta.revision + ' · ' + p.meta.updated

  if (!VIEWS[tab]) tab = 'overview'
  document.getElementById('tabs').innerHTML = TABS.map(t => {
    const n = t.count(p)
    const alert = t.alert && n > 0
    return `<button class="tab" role="tab" aria-selected="${t.id === tab}" data-act="go" data-to="${t.id}">${esc(t.label)}${
      n != null ? `<span class="b${alert ? ' alert' : ''}">${n}</span>` : ''}</button>`
  }).join('')

  document.getElementById('app').innerHTML =
    `<section>${VIEWS[tab](p)}</section>` +
    `<div class="foot">source of truth: docs/plan.json · <code>script/plan render</code> regenerates docs/PLAN.md · this page re-reads the JSON every 10s</div>`
}

/* ── one delegated listener for every interaction ─────────────────────────── */
// Click a connect command to copy it. The whole reason the server rows carry the full
// ssh line is so nobody has to reconstruct it, and retyping it by hand is the same
// cost as looking it up.
document.addEventListener('click', (e) => {
  const c = e.target.closest('.copyable')
  if (!c) return
  navigator.clipboard?.writeText(c.textContent).then(() => {
    const was = c.textContent
    c.textContent = 'copied'
    setTimeout(() => { c.textContent = was }, 900)
  }).catch(() => {})
})

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]')
  if (!el) return
  const act = el.dataset.act
  if (act === 'go') {
    tab = el.dataset.to; location.hash = '#' + tab; render()
    window.scrollTo({ top: 0, behavior: 'smooth' })
  } else if (act === 'row') {
    const s = uiFor(el.dataset.tab), k = el.dataset.key
    s.open.has(k) ? s.open.delete(k) : s.open.add(k)
    render()
  } else if (act === 'sort') {
    const s = uiFor(el.dataset.tab), k = el.dataset.key
    if (s.sort === k) s.dir *= -1; else { s.sort = k; s.dir = 1 }
    render()
  } else if (act === 'pg') {
    uiFor(el.dataset.tab).page = Number(el.dataset.to); render()
    window.scrollTo({ top: 0, behavior: 'smooth' })
  }
})
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-act="q"]')
  if (!el) return
  const s = uiFor(el.dataset.tab)
  s.q = el.value; s.page = 0
  render()
  // innerHTML was replaced, so restore focus and caret to the new input.
  const nu = document.querySelector('[data-act="q"]')
  if (nu) { nu.focus(); nu.setSelectionRange(nu.value.length, nu.value.length) }
})
document.getElementById('theme').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
  document.documentElement.setAttribute('data-theme', next)
  try { localStorage.setItem('plan-theme', next) } catch (e) {}
})
window.addEventListener('hashchange', () => { tab = (location.hash || '#overview').slice(1); render() })
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick() })

tick()
setInterval(tick, 10000)
</script>
